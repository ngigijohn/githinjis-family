{% extends "base.html" %}

{% block title %}Request received · {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="paper flex min-h-[70vh] items-center justify-center px-4 py-16">
  <div class="card max-w-md p-10 text-center">
    <span class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-brand-soft text-3xl text-brand">✓</span>
    <h1 class="mt-6 font-display text-3xl">Thank you!</h1>
    <p class="mt-3 text-muted">Your request has been sent to the family administrators. You'll be able to sign in once your account has been approved.</p>
    <a href="{% url 'genealogy:tree' %}" class="btn btn-primary mt-8">Explore the tree meanwhile</a>
  </div>
</div>
{% endblock %}
