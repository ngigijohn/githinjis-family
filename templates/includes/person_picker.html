{% comment %}
Searchable person selector backed by /api/people/search/.
Parameters: name, value, label, placeholder, exclude, input_id
{% endcomment %}
<div class="relative" x-data="personPicker({ endpoint: '{% url 'genealogy:api_people_search' %}', value: '{{ value|default:'' }}', label: '{{ label|default:''|escapejs }}', exclude: '{{ exclude|default:'' }}' })" @click.outside="open = false">
  <input type="hidden" name="{{ name }}" :value="selectedId">
  <div class="relative">
    <svg class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-muted" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 1 0 3.3 9.9l3.15 3.15a.75.75 0 1 0 1.06-1.06l-3.15-3.15A5.5 5.5 0 0 0 9 3.5ZM5 9a4 4 0 1 1 8 0 4 4 0 0 1-8 0Z" clip-rule="evenodd"/></svg>
    <input type="text" {% if input_id %}id="{{ input_id }}"{% endif %} class="input pl-10" autocomplete="off" placeholder="{{ placeholder|default:'Search by name…' }}"
           x-model="query" @input.debounce.200ms="search()" @keydown.arrow-down.prevent="move(1)" @keydown.arrow-up.prevent="move(-1)" @keydown.enter="enter($event)" @focus="results.length && (open = true)"
           role="combobox" :aria-expanded="open">
    <span x-show="selectedId" x-cloak class="absolute right-3 top-1/2 -translate-y-1/2 text-brand" aria-hidden="true">✓</span>
  </div>
  <ul x-cloak x-show="open" x-transition.opacity class="card absolute z-30 mt-2 max-h-72 w-full overflow-auto p-1.5" role="listbox">
    <template x-for="(person, i) in results" :key="person.pk">
      <li>
        <button type="button" @click="pick(person)" @mouseenter="active = i" :class="active === i ? 'bg-brand-soft' : ''" class="flex w-full items-center gap-3 rounded-xl px-3 py-2 text-left">
          <span class="flex h-8 w-8 flex-none items-center justify-center rounded-full bg-accent-soft text-xs font-semibold text-accent" x-text="person.initials"></span>
          <span class="min-w-0">
            <span class="block truncate text-sm font-medium text-ink" x-text="person.label"></span>
            <span class="block truncate text-xs text-muted" x-text="person.lifespan || 'Dates not recorded'"></span>
          </span>
        </button>
      </li>
    </template>
    <li x-show="!results.length" class="px-3 py-2 text-sm text-muted">No one found with that name.</li>
  </ul>
</div>
