{% extends "base.html" %}

{% block title %}Delete photo · {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg px-4 py-16">
  <div class="card p-8 text-center">
    <img src="{{ object.image.url }}" alt="{{ object }}" class="mx-auto h-40 w-40 rounded-2xl object-cover">
    <h1 class="mt-5 font-display text-3xl">Delete this photo?</h1>
    <p class="mt-3 text-muted">“{{ object }}” will be removed from the gallery and from everyone's profile. This cannot be undone.</p>
    <form method="post" class="mt-8 flex justify-center gap-3">
      {% csrf_token %}
      <a href="{% url 'gallery:photo_edit' object.pk %}" class="btn btn-secondary">Keep it</a>
      <button class="btn btn-danger">Yes, delete</button>
    </form>
  </div>
</div>
{% endblock %}
